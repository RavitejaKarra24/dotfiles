# Minimal overrides for Yazi 26.5.6.
# Defaults are supplied by Yazi so upstream schema changes do not leave a
# stale, copied configuration in this repository.

[mgr]
ratio          = [ 2, 4, 3 ]
sort_by        = "alphabetical"
sort_sensitive = false
sort_reverse   = false
sort_dir_first = true
sort_translit  = false
linemode       = "none"
show_hidden    = true
show_symlink   = true
scrolloff      = 5
mouse_events   = [ "click", "scroll" ]
title_format   = "Yazi: {cwd}"

[preview]
wrap         = "no"
tab_size     = 2
max_width    = 1200
max_height   = 1000
image_delay  = 30
image_filter = "triangle"
image_quality = 75

[tasks]
micro_workers = 10
macro_workers = 10
bizarre_retry = 3
image_alloc   = 536870912
